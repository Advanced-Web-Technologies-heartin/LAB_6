<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Student Portal - Registration</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>My Student Portal</h1>
        <p>Student registration</p>
    </header>

    <main>
        <section aria-labelledby="registration-heading">
            <h2 id="registration-heading">Registration Form</h2>

            <form id="registration-form" novalidate>
                <div>
                    <label for="full-name">Full name</label>
                    <input type="text" id="full-name" name="fullName">
                    <p id="name-counter" aria-live="polite"></p>
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </div>

                <div>
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone">
                </div>

                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password">
                </div>

                <div>
                    <label for="confirm-password">Confirm password</label>
                    <input type="password" id="confirm-password" name="confirmPassword">
                </div>

                <div>
                    <label for="city">City</label>
                    <select id="city" name="city">
                        <option value="">Select your city</option>
                        <option value="Tashkent">Tashkent</option>
                        <option value="Samarkand">Samarkand</option>
                        <option value="Bukhara">Bukhara</option>
                        <option value="Andijan">Andijan</option>
                    </select>
                    <p id="city-message" aria-live="polite"></p>
                </div>

                <ul id="form-errors" aria-live="polite"></ul>

                <button type="submit">Register</button>
            </form>
        </section>
    </main>
</body>
</html>
